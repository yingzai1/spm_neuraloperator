training:
  model_name: "FNO"
  dataset:
    # Support multiple parameter names and families for multi-dataset training
    parameter_name: ["Chen2020"]  # Can be array: ["Chen2020", "Prada2013"]
    family: ["GRF"]  # Can be array: ["GRF", "CC", "Triangle"]
    n_total: 11000
    # data_path will be constructed automatically from parameter_name and family arrays
    data_dir: "data/dataset/FNO-vanilla"  # Base directory for datasets
    test_ratio: 0.1
    random_seed: 42
  
  preprocessing:
    padding_t: 5
    padding_r: 2
    num_samples_I: 75
    num_samples_c0: 20
  
  model:
    k_modes: 10
    fno_depth: 6
    hidden_channels: 32
    output_channels: 1
  
  training:
    num_epochs: 150
    batch_size: 20
    
    # Learning rate schedule
    scheduler:
      warmup_steps_multiplier: 1.0  # warmup_steps = N_total/batch_size * this
      peak_lr: 1e-2
      total_steps_multiplier: 25.0  # total_steps = warmup_steps * this
      end_lr: 1e-4
  
  output:
    model_dir: "models/FNO"
    plot_results: true
    save_losses: true

# PyBaMM parameters
pybamm:
  t_max: 3600 
